# Render Blueprint: New > Blueprint > pick this repo.
# Values marked `sync: false` are asked for once when the Blueprint is created.
services:
  - type: web
    name: nightscreen-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon pooled connection string, pasted as-is (same as backend/.env)
        sync: false
      - key: FRONTEND_URL # e.g. https://nightscreen-web.onrender.com
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: nightscreen-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL # e.g. https://nightscreen-api.onrender.com
        sync: false
